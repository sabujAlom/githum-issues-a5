<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issues Tracker</title>
    <link
      rel="shortcut icon"
      href="assets/github-logo.png"
      type="image/x-icon"
    />

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- daisy ui and tailwind css -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css"
      rel="stylesheet"
    />

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="tailwind.init.css" />
  </head>
  <body class="bg-gray-100">


    <!--.............. Nabvar............. -->
    <div class="navbar bg-white shadow px-10">
      <div class="flex-1 flex items-center gap-2">
        <img
          src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          class="w-9"
        />
 
        <h1 class="text-neutral font-semibold text-lg">GitHub Issues Tracker</h1>
      </div>

      <div class="flex gap-3">
        <input
          id="searchInput"
          placeholder="Search issues..."
          class="input input-bordered input-sm w-64 p-3"
        />

        <button onclick="searchIssue()" class="btn btn-sm btn-outline">
          Search
        </button>

        <button class="btn btn-sm btn-primary text-white">+ New Issue</button>
      </div>
    </div>


    <!--.............. Content................... -->

    <div class="max-w-7xl mx-auto mt-8">
      <!--.......... Tab Bar........................ -->

      <div class="bg-white rounded-lg shadow p-6">
        <div class="tabs tabs-boxed flex gap-3 mb-4">
         <button onclick="loadIssues('all')" class="tab bg-purple-600 text-white px-4 py-1 rounded">All</button>
         <button onclick="loadIssues('open')" class="tab bg-gray-200 px-4 py-1 rounded">Open</button>
         <button onclick="loadIssues('closed')" class="tab bg-gray-200 px-4 py-1 rounded">Closed</button>
        </div>

        <!-- ISSUE HEADER -->

        <div class="flex justify-between items-center mb-6">
          <div class="flex items-center gap-3">
            <div
              class="w-8 h-8 bg-purple-100 text-purple-600 flex items-center justify-center rounded-full"
            >
              <img src="./assets/Aperture.png" alt="" />
            </div>

            <div>
              <p class="font-semibold" id="issueCount">50 Issues</p>

              <p class="text-sm text-gray-500">
                Track and manage project issues
              </p>
            </div>
          </div>

          <div class="flex gap-4 text-sm">
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 bg-green-500 rounded-full"></span>
              Open
            </div>

            <div class="flex items-center gap-2">
              <span class="w-3 h-3 bg-purple-500 rounded-full"></span>
              Closed
            </div>
          </div>
        </div>

        <!-- ISSUE GRID -->

        <div
          id="issuesContainer"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5"
        ></div>
      </div>
    </div>



    <!-- js script -->
    <script src="./script.js"></script>
  </body>
</html>
